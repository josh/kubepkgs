name: Update

on:
  schedule:
    - cron: "0 19 * * *" # 11am PST
  workflow_dispatch:
    inputs:
      package:
        description: Package attribute to update (leave empty for all)
        required: false
        type: string

permissions:
  contents: read

jobs:
  helm-charts:
    runs-on: nix-x86_64-linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GT_BOT_TOKEN }}

      - name: Configure git commit author
        run: |
          git config --local user.name 'gitea-actions[bot]'
          git config --local user.email 'gitea-actions@noreply.invalid'

      - name: Update Helm charts
        run: nix run .#update-helm-charts -- --push ${PACKAGE:+--only "$PACKAGE"}
        env:
          GITEA_TOKEN: ${{ secrets.GT_BOT_TOKEN }}
          PACKAGE: ${{ inputs.package }}

  oci-images:
    runs-on: nix-x86_64-linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GT_BOT_TOKEN }}

      - name: Configure git commit author
        run: |
          git config --local user.name 'gitea-actions[bot]'
          git config --local user.email 'gitea-actions@noreply.invalid'

      - name: Update OCI images
        run: nix run .#update-oci-images -- --push ${PACKAGE:+--only "$PACKAGE"}
        env:
          GITEA_TOKEN: ${{ secrets.GT_BOT_TOKEN }}
          PACKAGE: ${{ inputs.package }}

  json-snapshots:
    runs-on: nix-x86_64-linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GT_BOT_TOKEN }}

      - name: Configure git commit author
        run: |
          git config --local user.name 'gitea-actions[bot]'
          git config --local user.email 'gitea-actions@noreply.invalid'

      - name: Update JSON snapshots
        run: nix run .#update-json-snapshots -- --push ${PACKAGE:+--only "$PACKAGE"}
        env:
          GITEA_TOKEN: ${{ secrets.GT_BOT_TOKEN }}
          PACKAGE: ${{ inputs.package }}

  matrix:
    runs-on: nix-x86_64-linux

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-packages: ${{ steps.matrix.outputs.has-packages }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: matrix
        name: Generate package matrix
        run: |
          set -o pipefail
          nix eval --raw --impure --file ./internal/update-script-matrix.nix | tee "$GITHUB_OUTPUT"
        env:
          FLAKE_URI: ${{ github.workspace }}
          UPDATE_NIX_ATTR_PATH: ${{ inputs.package }}

  packages:
    name: update-${{ matrix.attr }}
    needs: matrix
    if: needs.matrix.outputs.has-packages == 'true'

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    runs-on: nix-x86_64-linux

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GT_BOT_TOKEN }}

      - name: Configure git commit author
        run: |
          git config --local user.name 'gitea-actions[bot]'
          git config --local user.email 'gitea-actions@noreply.invalid'

      - name: Run update-script
        run: nix run --file ./internal/update-script.nix </dev/null
        env:
          FLAKE_URI: ${{ github.workspace }}
          UPDATE_NIX_ATTR_PATH: ${{ matrix.attr }}
          GITEA_TOKEN: ${{ secrets.GT_BOT_TOKEN }}
